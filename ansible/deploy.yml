---
- name: Configure EC2 nodes and deploy the Java application
  hosts: app_servers
  become: true
  remote_user: ubuntu
  gather_facts: true

  vars:
    ansible_python_interpreter: /usr/bin/python3
    app_container_name: java-maven-app
    app_host_port: 8080

  pre_tasks:
    - name: Require an explicit container image
      ansible.builtin.assert:
        that:
          - app_image is defined
          - (app_image | default('') | length) > 0
        fail_msg: "Supply app_image as a versioned registry image reference."

    - name: Check the managed-node operating system
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == 'Ubuntu'
          - ansible_facts['distribution_version'] == '24.04'
        fail_msg: "This playbook currently supports Ubuntu 24.04 managed nodes."

  tasks:
    - name: Install Docker and its module dependencies
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-requests
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Run the application container
      community.docker.docker_container:
        name: "{{ app_container_name }}"
        image: "{{ app_image }}"
        state: started
        pull: missing
        restart_policy: unless-stopped
        published_ports:
          - "0.0.0.0:{{ app_host_port }}:8080"
        log_driver: json-file
        log_options:
          max-size: "10m"
          max-file: "3"

    - name: Wait for the application HTTP endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_host_port }}/"
        status_code: 200
        return_content: true
      register: app_response
      until: (app_response.status | default(0)) == 200
      retries: 20
      delay: 3
      changed_when: false

    - name: Verify the expected welcome page
      ansible.builtin.assert:
        that:
          - "'Welcome to Java Maven Application' in app_response.content"
        fail_msg: "The endpoint responded but did not contain the expected page."
